seed: 42
image_size: 96
num_classes: 3
class_names: [class_0, class_1, class_2]
model:
  backbone_channels: [8, 16, 32, 64]
  fpn_channels: 32
  aspp_channels: 32
  attention_heads: 4
  lstm_hidden: 32
  dropout: 0.3
training:
  epochs: 1
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler_factor: 0.5
  scheduler_patience: 5
  early_stopping_patience: 10
roi:
  segmentation_threshold: 0.5
  yolo_confidence: 0.25
  min_intersection_ratio: 0.05
  fallback: unet
